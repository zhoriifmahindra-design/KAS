<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KASKU ULTRA PRO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

:root{
--bg:#f4f6fb;
--card:#ffffff;
--text:#222;
}

.dark{
--bg:#1e1e1e;
--card:#2a2a2a;
--text:#eee;
}

body{
font-family:Arial;
background:var(--bg);
color:var(--text);
margin:0;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
}

.card{
background:var(--card);
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.stat{
padding:15px;
border-radius:10px;
color:white;
}

.masuk{background:#22c55e;}
.keluar{background:#ef4444;}
.saldoBox{background:#3b82f6;}

button{
padding:10px;
border:none;
border-radius:6px;
background:#4f46e5;
color:white;
cursor:pointer;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:6px;
border:1px solid #ddd;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
}

</style>
</head>

<body>

<div class="container">

<h2>
<i class="fa fa-wallet"></i> KASKU ULTRA PRO
<button onclick="toggleDark()" style="float:right">🌙</button>
</h2>

<div class="grid">

<div class="stat masuk">
Pemasukan
<h2 id="totalMasuk">0</h2>
</div>

<div class="stat keluar">
Pengeluaran
<h2 id="totalKeluar">0</h2>
</div>

<div class="stat saldoBox">
Saldo
<h2 id="saldo">0</h2>
</div>

</div>

<div class="card">

<h3>Tambah Transaksi</h3>

<input type="date" id="tanggal">

<select id="jenis">
<option value="masuk">Pemasukan</option>
<option value="keluar">Pengeluaran</option>
</select>

<input type="text" id="ket" placeholder="Keterangan">

<input type="text" id="jumlah" placeholder="Jumlah">

<button onclick="tambah()">Simpan</button>

</div>

<div class="card">

<input type="text" id="search" placeholder="Cari..." onkeyup="render()">

<select id="filter" onchange="render()">
<option value="all">Semua</option>
<option value="month">Bulan Ini</option>
<option value="year">Tahun Ini</option>
</select>

</div>

<div class="card">

<button onclick="importExcel()">Import Excel</button>
<button onclick="backup()">Backup</button>
<button onclick="restore()">Restore</button>
<button onclick="exportCSV()">Export CSV</button>

<input type="file" id="excelFile" style="display:none">
<input type="file" id="jsonFile" style="display:none">

</div>

<div class="card">

<h3>Grafik Bulanan</h3>
<canvas id="chart"></canvas>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

<script>

let dataKas=JSON.parse(localStorage.getItem("kas"))||[];
let chart;

function save(){
localStorage.setItem("kas",JSON.stringify(dataKas));
}

function rupiah(n){
return new Intl.NumberFormat("id-ID").format(n);
}

function tambah(){

let obj={
tanggal:document.getElementById("tanggal").value,
jenis:document.getElementById("jenis").value,
ket:document.getElementById("ket").value,
jumlah:Number(document.getElementById("jumlah").value)
};

if(!obj.tanggal || !obj.ket || !obj.jumlah){
alert("Lengkapi data");
return;
}

dataKas.push(obj);

save();

render();

}

function render(){

let tbody=document.getElementById("table");
tbody.innerHTML="";

let saldo=0, masuk=0, keluar=0;

dataKas.sort((a,b)=>a.tanggal.localeCompare(b.tanggal));

dataKas.forEach((d,i)=>{

let jumlah=Number(d.jumlah);

if(d.jenis=="masuk"){
saldo+=jumlah;
masuk+=jumlah;
}else{
saldo-=jumlah;
keluar+=jumlah;
}

tbody.innerHTML+=`
<tr>
<td>${d.tanggal}</td>
<td>${d.ket}</td>
<td>${d.jenis=="masuk"?rupiah(jumlah):""}</td>
<td>${d.jenis=="keluar"?rupiah(jumlah):""}</td>
<td>${rupiah(saldo)}</td>
<td>
<button onclick="hapus(${i})">X</button>
</td>
</tr>
`;

});

document.getElementById("saldo").innerText=rupiah(saldo);
document.getElementById("totalMasuk").innerText=rupiah(masuk);
document.getElementById("totalKeluar").innerText=rupiah(keluar);

grafik();

}

function hapus(i){

if(confirm("Hapus transaksi?")){
dataKas.splice(i,1);
save();
render();
}

}

function grafik(){

let bulanan={};

dataKas.forEach(d=>{

let bulan=d.tanggal.slice(0,7);

if(!bulanan[bulan]) bulanan[bulan]=0;

if(d.jenis=="masuk"){
bulanan[bulan]+=Number(d.jumlah);
}else{
bulanan[bulan]-=Number(d.jumlah);
}

});

let labels=Object.keys(bulanan);
let values=Object.values(bulanan);

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{

type:"bar",

data:{
labels:labels,
datasets:[{
label:"Saldo Bulanan",
data:values
}]
}

});

}

function backup(){

let blob=new Blob([JSON.stringify(dataKas)],{type:"application/json"});
let a=document.createElement("a");

a.href=URL.createObjectURL(blob);
a.download="backup_kas.json";
a.click();

}

function restore(){

document.getElementById("jsonFile").click();

}

document.getElementById("jsonFile").addEventListener("change",e=>{

let file=e.target.files[0];
let reader=new FileReader();

reader.onload=function(){
dataKas=JSON.parse(reader.result);
save();
render();
};

reader.readAsText(file);

});

function importExcel(){

document.getElementById("excelFile").click();

}

document.getElementById("excelFile").addEventListener("change",e=>{

let file=e.target.files[0];
let reader=new FileReader();

reader.onload=function(evt){

let workbook=XLSX.read(evt.target.result,{type:"array"});
let sheet=workbook.Sheets[workbook.SheetNames[0]];
let rows=XLSX.utils.sheet_to_json(sheet,{header:1});

rows.forEach((r,i)=>{

if(i==0) return;

let tanggal=r[0];
let ket=r[1];
let masuk=r[2];
let keluar=r[3];

if(masuk){
dataKas.push({tanggal,jenis:"masuk",ket,jumlah:Number(masuk)});
}

if(keluar){
dataKas.push({tanggal,jenis:"keluar",ket,jumlah:Number(keluar)});
}

});

save();
render();

};

reader.readAsArrayBuffer(file);

});

function exportCSV(){

let csv="Tanggal,Keterangan,Masuk,Keluar\n";

dataKas.forEach(d=>{
csv+=`${d.tanggal},${d.ket},${d.jenis=="masuk"?d.jumlah:""},${d.jenis=="keluar"?d.jumlah:""}\n`;
});

let blob=new Blob([csv]);

let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="kas.csv";
a.click();

}

function toggleDark(){

document.body.classList.toggle("dark");

}

render();

</script>

</body>
</html>
