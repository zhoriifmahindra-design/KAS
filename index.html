<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>PRO</title>

<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

:root{
--bg:#f4f6fb;
--card:#ffffff;
--text:#222;
}

.dark{
--bg:#1e1e1e;
--card:#2a2a2a;
--text:#eee;
}

body{
font-family:Arial;
background:var(--bg);
color:var(--text);
margin:0;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
}

.card{
background:var(--card);
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.stat{
padding:15px;
border-radius:10px;
color:white;
}

.masuk{background:#22c55e;}
.keluar{background:#ef4444;}
.saldoBox{background:#3b82f6;}

button{
padding:10px;
border:none;
border-radius:6px;
background:#4f46e5;
color:white;
cursor:pointer;
}

input,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:6px;
border:1px solid #ddd;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
}

@media (max-width:600px){

body{
padding:10px;
}

h2{
font-size:20px;
}

.card{
padding:15px;
overflow-x:auto;
}

.grid{
grid-template-columns:1fr;
}

.stat{
text-align:center;
}

button{
width:100%;
margin-top:5px;
}

input,select{
font-size:16px;
}

table{
font-size:12px;
}

th,td{
padding:6px;
}

td button{
padding:6px 8px;
font-size:12px;
}

canvas{
max-height:250px;
}

.tools{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:5px;
}

.card h3{
margin-top:0;
}

}

</style>
</head>

<body>

<div class="container">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

<h2 style="margin:0">
<i class="fa fa-wallet"></i> PRO
</h2>

<button onclick="toggleDark()">🌙</button>

</div>

<div class="grid">

<div class="stat masuk">
<i class="fa-solid fa-arrow-down"></i> Pemasukan
<h2 id="totalMasuk">0</h2>
</div>

<div class="stat keluar">
<i class="fa-solid fa-arrow-up"></i> Pengeluaran
<h2 id="totalKeluar">0</h2>
</div>

<div class="stat saldoBox">
<i class="fa-solid fa-wallet"></i> Saldo
<h2 id="saldo">0</h2>
</div>

</div>

<div class="card">

<h3>Tambah Transaksi</h3>

<input type="date" id="tanggal">

<select id="jenis">
<option value="masuk">⬇ Pemasukan</option>
<option value="keluar">⬆ Pengeluaran</option>
</select>

<input type="text" id="ket" placeholder="📝 Keterangan">

<input type="number" min="1" step="1" id="jumlah" placeholder="💰 Jumlah (Rp)">

<button onclick="tambah()">
<i class="fa-solid fa-floppy-disk"></i> Simpan
</button>

</div>

<div class="card">

<input type="text" id="search" placeholder="🔍 Cari..." onkeyup="render()">

<select id="filter" onchange="render()">
<option value="all">Semua</option>
<option value="month">Bulan Ini</option>
<option value="year">Tahun Ini</option>
</select>

</div>

<div class="card tools">

<button onclick="importExcel()">
<i class="fa-solid fa-file-excel"></i> Import Excel
</button>

<button onclick="backup()">
<i class="fa-solid fa-download"></i> Backup
</button>

<button onclick="restore()">
<i class="fa-solid fa-upload"></i> Restore
</button>

<button onclick="exportCSV()">
<i class="fa-solid fa-file-csv"></i> Export CSV
</button>

<input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none">
<input type="file" id="jsonFile" style="display:none">

</div>

<div class="card">

<h3>Grafik Bulanan</h3>
<canvas id="chart"></canvas>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Keterangan</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Saldo</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

<script>

let dataKas = JSON.parse(localStorage.getItem("kas")) || [];
let editId = null;
let chart;

document.getElementById("tanggal").value =
new Date().toISOString().split("T")[0];

function save(){
localStorage.setItem("kas",JSON.stringify(dataKas));
}

function rupiah(n){
return "Rp " + new Intl.NumberFormat("id-ID").format(n);
}

function tambah(){

let tanggal = document.getElementById("tanggal").value;
let jenis = document.getElementById("jenis").value;
let ket = document.getElementById("ket").value;
let jumlah = Number(document.getElementById("jumlah").value);

if(!tanggal || !ket || !jumlah){
alert("Lengkapi data");
return;
}

if(jumlah<=0){
alert("Jumlah harus lebih dari 0");
return;
}

if(editId){

let data = dataKas.find(d=>d.id===editId);

data.tanggal = tanggal;
data.jenis = jenis;
data.ket = ket;
data.jumlah = jumlah;

editId = null;

}else{

let obj={
id: Date.now(),
tanggal,
jenis,
ket,
jumlah
};

dataKas.push(obj);

}

save();
render();

document.getElementById("ket").value="";
document.getElementById("jumlah").value="";
document.getElementById("ket").focus();

}

function render(){

let search = document.getElementById("search").value.toLowerCase();
let filter = document.getElementById("filter").value;

let now = new Date();
let bulanIni = now.toISOString().slice(0,7);
let tahunIni = now.getFullYear();

dataKas.sort((a,b)=>new Date(a.tanggal)-new Date(b.tanggal));

let tbody=document.getElementById("table");
tbody.innerHTML="";

let saldo=0, masuk=0, keluar=0;

let masukFilter=0, keluarFilter=0, saldoFilter=0;

let dataTampil=[];

dataKas.forEach(d=>{

let cocokSearch=d.ket.toLowerCase().includes(search);

let cocokFilter=true;

if(filter=="month"){
cocokFilter=d.tanggal.slice(0,7)==bulanIni;
}

if(filter=="year"){
cocokFilter=d.tanggal.slice(0,4)==tahunIni;
}

if(cocokSearch && cocokFilter){
dataTampil.push(d);

if(d.jenis=="masuk"){
masukFilter += Number(d.jumlah);
saldoFilter += Number(d.jumlah);
}else{
keluarFilter += Number(d.jumlah);
saldoFilter -= Number(d.jumlah);
}

}

});

dataKas.forEach(d=>{

let jumlah=Number(d.jumlah);

if(d.jenis=="masuk"){
saldo+=jumlah;
masuk+=jumlah;
}else{
saldo-=jumlah;
keluar+=jumlah;
}

if(dataTampil.includes(d)){

tbody.innerHTML+=`
<tr>
<td>${d.tanggal}</td>
<td>${d.ket}</td>
<td>${d.jenis=="masuk"?rupiah(jumlah):""}</td>
<td>${d.jenis=="keluar"?rupiah(jumlah):""}</td>
<td>${rupiah(saldo)}</td>
<td>

<button onclick="edit(${d.id})">
<i class="fa-solid fa-pen"></i>
</button>

<button onclick="hapus(${d.id})">
<i class="fa-solid fa-trash"></i>
</button>

</td>
</tr>
`;

}

});

let pakaiFilter = filter!="all" || search!=="";

document.getElementById("saldo").innerText=rupiah(pakaiFilter ? saldoFilter : saldo);
document.getElementById("totalMasuk").innerText=rupiah(pakaiFilter ? masukFilter : masuk);
document.getElementById("totalKeluar").innerText=rupiah(pakaiFilter ? keluarFilter : keluar);
grafik();

}

function hapus(id){

if(confirm("Hapus transaksi?")){

dataKas=dataKas.filter(d=>d.id!==id);

save();
render();

}

}

function edit(id){

let d = dataKas.find(x=>x.id===id);

document.getElementById("tanggal").value = d.tanggal;
document.getElementById("jenis").value = d.jenis;
document.getElementById("ket").value = d.ket;
document.getElementById("jumlah").value = d.jumlah;

editId = id;

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function grafik(){

if(dataKas.length===0){
if(chart) chart.destroy();
return;
}

let bulanan={};

dataKas.forEach(d=>{

let bulan=d.tanggal.slice(0,7);

if(!bulanan[bulan]) bulanan[bulan]=0;

if(d.jenis=="masuk"){
bulanan[bulan]+=Number(d.jumlah);
}else{
bulanan[bulan]-=Number(d.jumlah);
}

});

let labels=Object.keys(bulanan).sort();
let values=labels.map(l=>bulanan[l]);

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{

type:"bar",

data:{
labels:labels,
datasets:[{
label:"Saldo Bulanan",
data:values
}]
},

options:{
responsive:true,
plugins:{
legend:{display:true}
},
scales:{
y:{
beginAtZero:true
}
}
}

});
}

function backup(){

let blob=new Blob([JSON.stringify(dataKas)],{type:"application/json"});

let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup_kas.json";
a.click();

}

function restore(){
document.getElementById("jsonFile").click();
}

document.getElementById("jsonFile").addEventListener("change",e=>{

let file=e.target.files[0];
let reader=new FileReader();

reader.onload=function(){
dataKas=JSON.parse(reader.result);
save();
render();
};

reader.readAsText(file);

});

function importExcel(){
document.getElementById("excelFile").click();
}

document.getElementById("excelFile").addEventListener("change",function(e){

const file=e.target.files[0];

if(!file){
alert("File tidak dipilih");
return;
}

const reader=new FileReader();

reader.onload=function(event){

const data=new Uint8Array(event.target.result);

const workbook=XLSX.read(data,{type:"array"});

const sheet=workbook.Sheets[workbook.SheetNames[0]];

const rows=XLSX.utils.sheet_to_json(sheet,{header:1});

rows.forEach((r,i)=>{

if(i===0) return;

let tanggal=r[0];
if(!tanggal) return;

let ket=r[1];
let masuk=r[2];
let keluar=r[3];

if(masuk && masuk!=0){

dataKas.push({
id:Date.now()+Math.random(),
tanggal:formatTanggal(tanggal),
jenis:"masuk",
ket:ket||"",
jumlah:Number(masuk)
});

}

if(keluar && keluar!=0){

dataKas.push({
id:Date.now()+Math.random(),
tanggal:formatTanggal(tanggal),
jenis:"keluar",
ket:ket||"",
jumlah:Number(keluar)
});

}

});

save();
render();

alert("Import Excel berhasil");

document.getElementById("excelFile").value="";

};

reader.readAsArrayBuffer(file);

});

function formatTanggal(tgl){

if(typeof tgl==="number"){

let date=XLSX.SSF.parse_date_code(tgl);

return date.y+"-"+String(date.m).padStart(2,"0")+"-"+String(date.d).padStart(2,"0");

}

return tgl;

}

function exportCSV(){

let csv="Tanggal,Keterangan,Masuk,Keluar\n";

dataKas.forEach(d=>{

csv+=`${d.tanggal},${d.ket},${d.jenis=="masuk"?d.jumlah:""},${d.jenis=="keluar"?d.jumlah:""}\n`;

});

let blob=new Blob([csv]);

let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="kas.csv";
a.click();

}

function toggleDark(){
document.body.classList.toggle("dark");
}

render();

</script>

</body>
</html>
